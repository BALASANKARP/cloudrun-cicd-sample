name: Deploy to Cloud Run

on:
  push:
    branches: [ dev ]  # Trigger only on pushes to dev branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout the repo
    - name: Checkout code
      uses: actions/checkout@v3

    # 2️⃣ Authenticate with GCP using service account key
    - name: Set up Google Cloud credentials
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # 3️⃣ Configure Docker to push to Artifact Registry
    - name: Configure Docker
      run: |
        gcloud auth configure-docker ${REGION}-docker.pkg.dev

    # 4️⃣ Build Docker image and push to Artifact Registry
    - name: Build and Push Docker image
      run: |
        IMAGE=${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/sample-repo/${{ secrets.SERVICE_NAME }}:${{ github.sha }}
        docker build -t $IMAGE .
        docker push $IMAGE
        echo "IMAGE=$IMAGE" >> $GITHUB_ENV

    # 5️⃣ Deploy to Cloud Run
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ secrets.SERVICE_NAME }} \
          --image $IMAGE \
          --region ${{ secrets.REGION }} \
          --platform managed \
          --allow-unauthenticated
